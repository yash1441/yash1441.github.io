<!DOCTYPE html>
<html lang="en">
	<head>
		<!-- Basic Meta -->
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="title" content="Simon's Store" />
		<meta
			name="description"
			content="Buy quality second-hand gaming gear, collectibles, and personal items directly from Yash — DM me on Discord if interested!"
		/>

		<!-- Open Graph / Discord / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://y-gaming.in/store" />
		<meta property="og:title" content="Simon's Store" />
		<meta
			property="og:description"
			content="Buy my personal items for sale. DM me if interested!"
		/>
		<!-- <meta
			property="og:image"
			content="https://y-gaming.in/assets/store-preview.jpg"
		/> -->
		<meta property="og:site_name" content="Y-Gaming" />

		<!-- Twitter -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:url" content="https://y-gaming.in/store" />
		<meta name="twitter:title" content="Simon's Store" />
		<meta
			name="twitter:description"
			content="Buy my personal items for sale. DM me if interested!"
		/>
		<!-- <meta
			name="twitter:image"
			content="https://y-gaming.in/assets/store-preview.jpg"
		/> -->

		<!-- Fallback for older scrapers -->
		<!-- <link rel="image_src" href="https://y-gaming.in/assets/store-preview.jpg" /> -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Simon's Store</title>
		<link rel="stylesheet" href="style.css" />
		<style>
			body {
				font-family: sans-serif;
				background: #f7f7f7;
				margin: 0;
				padding: 20px;
			}

			/* Wrapper */
			.main-content {
				max-width: 1000px;
				margin: 0 auto;
				text-align: center;
			}

			/* Heading & description */
			h1 {
				font-size: 2rem;
				color: #264653;
				margin-bottom: 8px;
				position: relative;
				display: inline-block;
				padding-bottom: 6px;
			}

			h1::after {
				content: "";
				position: absolute;
				bottom: 0;
				left: 50%;
				transform: translateX(-50%);
				width: 60px;
				height: 3px;
				background-color: #2a9d8f; /* matches button color */
				border-radius: 2px;
			}

			p {
				color: #6c757d;
				font-size: 1.05rem;
				margin-bottom: 30px;
			}

			/* Product grid */
			.container {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
				gap: 20px;
				width: 100%;
				max-width: 1000px;
				margin: 0 auto;
			}

			/* Card styling */
			.card {
				background: #fff;
				border-radius: 12px;
				padding: 15px;
				box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
				transition: transform 0.25s ease, box-shadow 0.25s ease;
			}

			.card:hover {
				transform: translateY(-6px);
				box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15),
					0 0 10px rgba(42, 157, 143, 0.25); /* soft green glow */
			}

			/* Image styling */
			.card img {
				width: 100%;
				height: 180px;
				object-fit: cover;
				border-radius: 8px;
				transition: transform 0.3s ease;
			}
			.card:hover img {
				transform: scale(1.05);
			}

			/* Price + contact */
			.price {
				color: #2a9d8f;
				font-weight: bold;
				font-size: 1.1em;
			}
			.contact {
				background: #2a9d8f;
				color: white;
				padding: 8px 12px;
				border-radius: 6px;
				text-decoration: none;
				display: inline-block;
				margin-top: 10px;
			}

			/* Sold badge in the image corner */
			.image-wrapper {
				position: relative; /* ⬅️ this is the wrapper, not the img */
			}

			.image-wrapper img {
				width: 100%;
				height: 220px;
				object-fit: cover;
				border-radius: 10px;
				transition: opacity 0.4s ease;
			}

			.sold-badge {
				position: absolute;
				top: 10px;
				right: 10px;
				background: rgba(231, 76, 60, 0.9);
				color: white;
				padding: 5px 10px;
				font-weight: bold;
				border-radius: 6px;
				font-size: 0.9rem;
				box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
				z-index: 10;

				opacity: 0.7; /* default slightly transparent */
				transition: opacity 0.3s ease, transform 0.3s ease;
			}

			.card:hover .sold-badge {
				opacity: 1; /* fully visible on hover */
				transform: scale(1.05); /* slight pop effect */
			}

			/* Greyed-out sold look */
			.card.sold img {
				opacity: 0.4;
				filter: grayscale(100%);
			}

			.card.sold {
				opacity: 0.8;
				box-shadow: none;
			}

			.sold-text {
				color: #e74c3c;
				font-weight: bold;
				font-size: 1rem;
			}

			.label {
				display: inline-block;
				margin: 6px 0;
				padding: 3px 8px;
				border-radius: 6px;
				font-size: 0.9rem;
				font-weight: bold;
			}

			.label.quality {
				background-color: #ffe599;
				color: #665500;
				cursor: default;
				position: relative;
				display: inline-block;
				padding: 3px 8px;
				border-radius: 6px;
			}

			/* Tooltip hidden by default */
			.quality-tooltip {
				display: none;
				position: absolute;
				bottom: 120%;
				left: 50%;
				transform: translateX(-50%);
				background: #333;
				color: #fff;
				padding: 6px 10px;
				border-radius: 6px;
				font-size: 0.8rem;
				white-space: nowrap;
				text-align: center;
				z-index: 20;
				min-width: 160px;
			}

			/* Show tooltip on hover */
			.label.quality:hover .quality-tooltip {
				display: block;
			}

			.label.discount {
				background-color: #e74c3c; /* red */
				color: white;
				margin-left: 5px;
				position: relative; /* for tooltip positioning */
				cursor: default;
			}

			/* Tooltip hidden by default */
			.discount-tooltip {
				display: none;
				position: absolute;
				bottom: 120%; /* above the label */
				left: 50%;
				transform: translateX(-50%);
				background: #333;
				color: #fff;
				padding: 4px 8px;
				border-radius: 4px;
				font-size: 0.75rem;
				white-space: nowrap;
				z-index: 20;
			}

			/* Show tooltip on hover */
			.label.discount:hover .discount-tooltip {
				display: block;
			}

			/* Responsive adjustments */
			@media (max-width: 800px) {
				.container {
					grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
					max-width: 90%;
				}
			}

			@media (max-width: 500px) {
				.container {
					grid-template-columns: 1fr;
					max-width: 90%;
				}
			}
		</style>
	</head>
	<body>
		<div class="main-content">
			<h1>Simon's Store</h1>
			<p>These are my personal items for sale. DM me if interested!</p>

			<div id="product-container" class="container">
				<!-- JS fills this -->
			</div>
		</div>

		<script src="js/products.js"></script>
	</body>
</html>
